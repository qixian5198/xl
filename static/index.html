<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>情商口才训练</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-top">
      <h1>情商口才训练</h1>
      <a id="settingsLink" href="/settings.html">⚙ 设置</a>
    </div>

    <section>
      <h2>开始训练</h2>
      <label>身份</label>
      <select id="personaSel"></select>
      <label>模式</label>
      <select id="modeSel">
        <option value="mood">模式一 · 判断心情</option>
        <option value="personality">模式二 · 判断性格</option>
        <option value="chat">模式三 · 聊天问答</option>
        <option value="soul">模式四 · 灵魂提问</option>
      </select>
      <button id="startBtn">开始会话</button>
      <div class="row" style="align-items:flex-end;gap:8px">
        <input id="sceneInput" placeholder="可选：本次场景，如「朋友介绍来问睡眠问题」" style="flex:1">
        <button id="sceneRandomBtn" class="ghost" style="width:88px;margin-top:0">随机场景</button>
      </div>
    </section>

    <section>
      <h2>历史会话</h2>
      <select id="sessionSel"><option value="">—</option></select>
      <div class="row">
        <button id="endBtn" disabled>结束并复盘</button>
        <button id="reviewBtn" disabled class="ghost">生成复盘</button>
      </div>
      <div class="hint" id="sessionHint" style="margin-top:6px"></div>
    </section>

    <section class="model-mini" id="modelMini"></section>
  </aside>

  <main class="chat">
    <header>
      <span id="chatTitle">选择身份和模式，开始会话</span>
      <div class="row" style="gap:10px;align-items:center">
        <button id="coachBtn" class="ghost" disabled>暂停点评</button>
        <label class="nudge-toggle" title="你超过 N 分钟没说话时，机器人会主动搭话">
          <input type="checkbox" id="nudgeOn" checked>
          <span id="nudgeLabel"></span>
        </label>
        <select id="nudgeMin" style="width:90px;margin:0">
          <option value="1">1 分钟</option>
          <option value="3">3 分钟</option>
          <option value="5" selected>5 分钟</option>
          <option value="10">10 分钟</option>
        </select>
        <button id="soulBtn" class="ghost" disabled>灵魂提问</button>
      </div>
    </header>
    <div id="msgs"></div>

    <div id="guessPanel" class="hidden">
      <h3>猜猜我现在的状态？</h3>
      <div id="guessFields"></div>
      <button id="guessSubmitBtn">提交判断</button>
    </div>

    <div id="inputArea">
      <textarea id="input" rows="2" placeholder="说点什么…"></textarea>
      <button id="sendBtn">发送</button>
    </div>
  </main>

  <aside class="review">
    <h2>复盘</h2>
    <div id="summary">会话结束后点「结束并复盘」。</div>
    <button id="nextScenarioBtn" class="hidden">按推荐场景再练一局</button>
  </aside>
</div>

<script src="chat.js"></script>
</body>
</html>
