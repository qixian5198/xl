<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>情商口才训练</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-top">
      <h1>情商口才训练</h1>
      <a id="settingsLink" href="/settings.html">⚙ 设置</a>
    </div>

    <section>
      <h2>开始聊天</h2>
      <label>身份</label>
      <select id="personaSel"></select>
      <div class="row" style="align-items:flex-end;gap:8px">
        <button id="startBtn" style="flex:1">开始会话</button>
        <button id="endSidebarBtn" class="ghost" disabled style="flex:1;margin-top:0">结束会话</button>
      </div>
      <div class="row" style="align-items:flex-end;gap:8px">
        <input id="sceneInput" placeholder="可选：本次场景，如「朋友介绍来问睡眠问题」" style="flex:1">
        <button id="sceneRandomBtn" class="ghost" style="width:88px;margin-top:0">随机场景</button>
      </div>
    </section>

    <section class="history">
      <div class="section-head">
        <h2>进行中会话</h2>
        <span id="activeCount" class="hist-count"></span>
      </div>
      <div id="activeList" class="session-list session-list-active"></div>
    </section>

    <section class="history">
      <div class="section-head">
        <h2>技术卡</h2>
        <span id="skillCount" class="hist-count"></span>
      </div>
      <div id="skillSidebarList" class="skill-sidebar-list"></div>
      <div class="pager" id="skillPager">
        <button id="skillPrevPage" class="ghost" style="width:auto;margin-top:0">‹</button>
        <span id="skillPageInfo" class="hint"></span>
        <button id="skillNextPage" class="ghost" style="width:auto;margin-top:0">›</button>
      </div>
    </section>

    <section class="history">
      <div class="section-head">
        <h2>历史会话</h2>
        <span id="histCount" class="hist-count"></span>
      </div>
      <div id="sessionList" class="session-list"></div>
      <div class="pager" id="pager">
        <button id="prevPage" class="ghost" style="width:auto;margin-top:0">‹</button>
        <span id="pageInfo" class="hint"></span>
        <button id="nextPage" class="ghost" style="width:auto;margin-top:0">›</button>
      </div>
    </section>

    <section class="model-mini" id="modelMini"></section>
  </aside>

  <main class="chat">
    <header>
      <span id="chatTitle">选择身份，开始会话</span>
      <div class="row" style="gap:10px;align-items:center">
        <button id="endSessionBtn" class="ghost" disabled>结束会话</button>
        <button id="coachBtn" class="ghost" disabled>暂停点评</button>
        <label class="nudge-toggle" title="你超过 N 分钟没说话时，机器人会主动搭话">
          <input type="checkbox" id="nudgeOn" checked>
          <span id="nudgeLabel"></span>
        </label>
        <select id="nudgeMin" style="width:90px;margin:0">
          <option value="1">1 分钟</option>
          <option value="3">3 分钟</option>
          <option value="5" selected>5 分钟</option>
          <option value="10">10 分钟</option>
        </select>
        <button id="soulBtn" class="ghost" disabled>灵魂提问</button>
      </div>
    </header>
    <div id="skillPanel" class="skill-panel hidden">
      <span class="skill-label">技术卡</span>
      <div id="skillChips"></div>
      <span class="hint">不勾选 = 按场景自动匹配；勾选 = 本会话固定使用所选卡片（聊天和暂停点评都会参考）</span>
    </div>
    <div id="msgs"></div>

    <div id="inputArea">
      <textarea id="input" rows="2" placeholder="说点什么…"></textarea>
      <button id="sendBtn">发送</button>
    </div>
  </main>
</div>

<script src="chat.js"></script>
</body>
</html>
